name: vigil

x-backend: &backend
  build: ./backend
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://vigil:vigil@postgres:5432/vigil
    REDIS_URL: redis://redis:6379/0
    EVENT_BUS: redis
    SCORING_MODE: celery
    ENVIRONMENT: production
    JWT_SECRET: ${JWT_SECRET:-change-me-local-compose-secret-0123456789}
    LLM_PROVIDER: ${LLM_PROVIDER:-auto}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    <<: *backend
    ports: ["8000:8000"]

  worker:
    <<: *backend
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4 -Q scoring
    healthcheck: { disable: true }

  beat:
    <<: *backend
    command: celery -A app.worker.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    healthcheck: { disable: true }

  simulator:
    <<: *backend
    command: python -m app.simulator --api http://api:8000 --rate ${SIM_RATE:-1.5}
    depends_on:
      api: { condition: service_healthy }
    healthcheck: { disable: true }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # Optional local LLM: `docker compose --profile ollama up`, then
  # `docker compose exec ollama ollama pull qwen2.5:7b` and set LLM_PROVIDER=ollama.
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes: [ollama:/root/.ollama]

volumes:
  pgdata:
  ollama:
