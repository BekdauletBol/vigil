# One-click deploy: https://render.com/deploy?repo=https://github.com/BekdauletBol/vigil
services:
  - type: web
    name: vigil-aml
    runtime: docker
    plan: free
    region: frankfurt # closest Render region to Central Asia; keep the database there too
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # PostgreSQL connection string (Neon, Supabase, Render…), set in the dashboard.
      # Without it the demo runs on SQLite and resets whenever the service sleeps.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: auto
      - key: ANTHROPIC_API_KEY
        sync: false # optional: set in the dashboard to enable Claude
